name: Generate SBOM and Attest
description: >
  Generates a CycloneDX SBOM of the given Docker image with syft, uploads it as the run
  artifact 'sbom.cyclonedx.json', and attaches it to the image (by digest) via cosign
  (SBOM + SLSA provenance attestations).

  The Dependency-Track upload lives in the separate 'upload-sbom-dependency-track' action:
  it must run on a self-hosted runner because dtrack.inventage.com is only reachable from
  the internal network, while this action runs fine on GitHub-hosted runners.

  Attestation degrades gracefully: when the cosign secrets are not provided, the step is
  skipped with a notice instead of failing the build.

  Verification example:
    cosign verify-attestation --key cosign.pub --type cyclonedx --insecure-ignore-tlog <image>@<digest>

inputs:
  image:
    description: Fully qualified image name without tag (e.g. ghcr.io/inventage/keycloak-custom/com.inventage.keycloak.custom.container)
    required: true
  version:
    description: Full build version (e.g. 1.0.0-202507161230-42-abcdef1) used as the image tag
    required: true
  registry:
    description: Docker registry host, used for the cosign/crane login
    required: false
    default: ghcr.io
  registry-user:
    description: Registry username (image pull for syft, attestation push for cosign)
    required: true
  registry-password:
    description: Registry password or token (image pull for syft, attestation push for cosign)
    required: true
  cosign-private-key:
    description: Cosign private key for signing attestations (empty = skip attestation)
    required: false
    default: ''
  cosign-password:
    description: Cosign private key password
    required: false
    default: ''
  attest-provenance:
    description: Also attach a SLSA provenance attestation to the image
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install syft
      id: syft
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

    - name: Generate image SBOM
      shell: bash
      env:
        SYFT: ${{ steps.syft.outputs.cmd }}
        SYFT_REGISTRY_AUTH_USERNAME: ${{ inputs.registry-user }}
        SYFT_REGISTRY_AUTH_PASSWORD: ${{ inputs.registry-password }}
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
      run: |
        "$SYFT" scan "registry:${IMAGE}:${VERSION}" -o cyclonedx-json@1.6=sbom.cyclonedx.json

    # The artifact is consumed by the upload-sbom-dependency-track action in a later job
    # (and can be downloaded for inspection)
    - name: Upload SBOM artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom.cyclonedx.json
        path: sbom.cyclonedx.json
        # Artifacts are immutable within a run; without this, "Re-run all jobs" fails
        # on the duplicate artifact name from the previous attempt
        overwrite: true

    - name: Notice — attestation skipped
      if: ${{ inputs.cosign-private-key == '' }}
      shell: bash
      run: echo "::notice::COSIGN_PRIVATE_KEY not provided — skipping SBOM/provenance attestation."

    - name: Install cosign
      if: ${{ inputs.cosign-private-key != '' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install crane
      if: ${{ inputs.cosign-private-key != '' }}
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Generate SLSA provenance predicate
      if: ${{ inputs.cosign-private-key != '' && inputs.attest-provenance == 'true' }}
      shell: bash
      run: |
        jq -n \
          --arg builder_id "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
          --arg uri "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@${GITHUB_REF}" \
          --arg sha "${GITHUB_SHA}" \
          --arg entry_point "${GITHUB_WORKFLOW}" \
          --arg invocation_id "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
          '{
            builder: { id: $builder_id },
            buildType: "https://docs.github.com/actions/workflow",
            invocation: {
              configSource: {
                uri: $uri,
                digest: { sha1: $sha },
                entryPoint: $entry_point
              }
            },
            metadata: {
              buildInvocationId: $invocation_id,
              completeness: { parameters: true, environment: false, materials: false },
              reproducible: false
            },
            materials: [{ uri: $uri, digest: { sha1: $sha } }]
          }' > provenance.slsa.json

    - name: Attest SBOM and provenance
      if: ${{ inputs.cosign-private-key != '' }}
      shell: bash
      env:
        COSIGN_PRIVATE_KEY: ${{ inputs.cosign-private-key }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USER: ${{ inputs.registry-user }}
        REGISTRY_PW: ${{ inputs.registry-password }}
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        ATTEST_PROVENANCE: ${{ inputs.attest-provenance }}
      run: |
        crane auth login "$REGISTRY" -u "$REGISTRY_USER" -p "$REGISTRY_PW"

        # Attest by digest, so the attestation stays bound to the exact (multi-arch) manifest
        DIGEST=$(crane digest "${IMAGE}:${VERSION}")

        echo "Attesting SBOM for ${IMAGE}@${DIGEST}"
        cosign attest --key env://COSIGN_PRIVATE_KEY \
          --use-signing-config=false --new-bundle-format=false --tlog-upload=false \
          --predicate sbom.cyclonedx.json --type cyclonedx "${IMAGE}@${DIGEST}"

        if [ "$ATTEST_PROVENANCE" = "true" ]; then
          echo "Attesting SLSA provenance for ${IMAGE}@${DIGEST}"
          cosign attest --key env://COSIGN_PRIVATE_KEY \
            --use-signing-config=false --new-bundle-format=false --tlog-upload=false \
            --predicate provenance.slsa.json --type slsaprovenance "${IMAGE}@${DIGEST}"
        fi

    - name: Summary
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        HAS_COSIGN: ${{ inputs.cosign-private-key != '' }}
      run: |
        {
          echo "## SBOM"
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Image | \`${IMAGE}\` |"
          echo "| Version | \`${VERSION}\` |"
          echo "| Attested | ${HAS_COSIGN} |"
        } >> "$GITHUB_STEP_SUMMARY"
